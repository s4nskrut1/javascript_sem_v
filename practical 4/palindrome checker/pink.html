<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palindrome Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#89f7fe);
background-size:400% 400%;
animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.circle{

position:absolute;

border-radius:50%;

background:rgba(255,255,255,.25);

backdrop-filter:blur(5px);

animation:float 8s infinite ease-in-out;

}

.c1{

width:220px;
height:220px;

top:-60px;
left:-60px;

}

.c2{

width:160px;
height:160px;

bottom:-40px;
right:60px;

animation-delay:2s;

}

.c3{

width:120px;
height:120px;

top:65%;
left:18%;

animation-delay:4s;

}

@keyframes float{

50%{

transform:translateY(-25px);

}

}

.container{

width:430px;

padding:40px;

background:rgba(255,255,255,.20);

backdrop-filter:blur(18px);

border-radius:30px;

border:1px solid rgba(255,255,255,.4);

box-shadow:0 20px 50px rgba(0,0,0,.15);

text-align:center;

}

.icon{

width:90px;
height:90px;

margin:auto;
margin-bottom:20px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-size:42px;

background:white;

box-shadow:0 10px 25px rgba(0,0,0,.1);

}

h1{

color:white;
margin-bottom:8px;

}

p{

color:white;

opacity:.95;

margin-bottom:25px;

}

input{

width:100%;

padding:15px;

border:none;

border-radius:15px;

outline:none;

font-size:16px;

margin-bottom:20px;

transition:.3s;

}

input:focus{

transform:scale(1.02);

box-shadow:0 0 18px rgba(255,255,255,.8);

}

button{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:linear-gradient(90deg,#ff758c,#ff7eb3);

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-4px);

box-shadow:0 15px 30px rgba(255,118,163,.45);

}

.footer{

margin-top:22px;

color:white;

font-size:13px;

opacity:.8;

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="container">

<div class="icon">🪞</div>

<h1>Palindrome Checker</h1>

<p>Check whether your word reads the same forwards and backwards.</p>

<input
type="text"
id="word"
placeholder="Enter a word...">

<button onclick="checkPalindrome()">
✨ Check Word
</button>

<div class="footer">
Developed by Sanskruti Gorle | 24070521025
</div>

</div>

<script>

function reverseString(str){
return str.split("").reverse().join("");
}

function message(){

var msg="Palindrome Checker";

function display(){

return msg;

}

return display;

}

function checkPalindrome(){

try{

var word=document.getElementById("word").value.trim();

if(word==""){
throw "Please enter a word.";
}

if(!/^[A-Za-z]+$/.test(word)){
throw "Only alphabets are allowed.";
}

if(word.length<3){
throw "Please enter at least 3 characters."; 
}

if(word.length>20){
throw "Maximum 20 characters are allowed.";
}

let input=word.toLowerCase();

var reverse=reverseString(input);

document.write(`

<!DOCTYPE html>

<html>

<head>

<title>Result</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#a18cd1,#89f7fe);
background-size:400% 400%;
animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.card{

width:440px;

padding:40px;

background:rgba(255,255,255,.92);

border-radius:30px;

box-shadow:0 20px 50px rgba(0,0,0,.15);

text-align:center;

}

.icon{

font-size:60px;

margin-bottom:15px;

}

h2{

color:#444;

}

hr{

margin:20px 0;

border:none;

height:2px;

background:#eee;

}

.word{

font-size:20px;

margin-bottom:20px;

color:#555;

}

.success{

color:#16a34a;

font-size:24px;

font-weight:600;

}

.fail{

color:#ef4444;

font-size:24px;

font-weight:600;

}

button{

margin-top:30px;

padding:14px 28px;

border:none;

border-radius:15px;

background:linear-gradient(90deg,#ff758c,#ff7eb3);

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

</style>

</head>

<body>

<div class="card">

<div class="icon">${input==reverse ? "🎉" : "🤔"}</div>

<h2>${message()()}</h2>

<hr>

<div class="word">
<b>Entered Word:</b> ${word}
</div>

`);

if(input==reverse){

document.write(`
<div class="success">
💖 It's a Palindrome!
</div>
`);

}

else{

document.write(`
<div class="fail">
❌ Not a Palindrome
</div>
`);

}

document.write(`

<button onclick="history.back()">
🔄 Check Another Word
</button>

</div>

</body>

</html>

`);

}

catch(error){

alert(error);

}

}

</script>

</body>
</html>
