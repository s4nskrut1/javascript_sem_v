<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Gradient Canvas -->
  <rect width="400" height="220" rx="12" fill="url(#chatGrad)"/>

  <!-- Chat Dialog Window Mockup -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="35" width="300" height="150" rx="14" fill="#ffffff"/>
    
    <!-- Window top dots -->
    <circle cx="70" cy="52" r="3.5" fill="#f87171"/>
    <circle cx="82" cy="52" r="3.5" fill="#fbbf24"/>
    <circle cx="94" cy="52" r="3.5" fill="#34d399"/>
    <line x1="325" y1="48" x2="333" y2="56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="333" y1="48" x2="325" y2="56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Chat speech bubble -->
    <path d="M 75 75 L 305 75 A 10 10 0 0 1 315 85 L 315 130 A 10 10 0 0 1 305 140 L 95 140 L 75 152 L 80 140 A 10 10 0 0 1 70 130 L 70 85 A 10 10 0 0 1 75 75 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <text x="88" y="96" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#334155" font-weight="500">
      AI-driven assistant can parse natural text,
    </text>
    <text x="88" y="112" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#334155" font-weight="500">
      understand user intent, and deliver real-time
    </text>
    <text x="88" y="128" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#334155" font-weight="500">
      intelligent responses.
    </text>

    <!-- Pill Action Button inside Chatbot -->
    <rect x="200" y="148" width="125" height="26" rx="13" fill="#2563eb"/>
    <text x="262" y="165" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
      AI-driven Chatbot ✦
    </text>
  </g>
</svg>
