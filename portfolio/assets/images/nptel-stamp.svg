<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Serrated Postage Stamp Border -->
  <rect x="5" y="5" width="90" height="90" rx="4" fill="#9f1239" stroke="#be123c" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="12" y="12" width="76" height="76" rx="2" fill="#fff1f2"/>
  
  <!-- Stamp Inner Pattern -->
  <circle cx="50" cy="46" r="22" fill="none" stroke="#9f1239" stroke-width="2"/>
  <!-- NPTEL Wheel spokes -->
  <line x1="50" y1="24" x2="50" y2="68" stroke="#9f1239" stroke-width="1.5"/>
  <line x1="28" y1="46" x2="72" y2="46" stroke="#9f1239" stroke-width="1.5"/>
  <line x1="34" y1="30" x2="66" y2="62" stroke="#9f1239" stroke-width="1.5"/>
  <line x1="34" y1="62" x2="66" y2="30" stroke="#9f1239" stroke-width="1.5"/>
  <circle cx="50" cy="46" r="6" fill="#9f1239"/>
  
  <!-- NPTEL text -->
  <text x="50" y="80" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#9f1239" text-anchor="middle" letter-spacing="1.5">NPTEL</text>
</svg>
