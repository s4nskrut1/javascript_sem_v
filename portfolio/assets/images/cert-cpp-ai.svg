  <text x="400" y="265" font-family="'Fraunces', 'Georgia', serif" font-size="30" font-style="italic" font-weight="700" fill="#e11d48" text-anchor="middle">Sanskruti Gorle</text>
  
  <line x1="240" y1="282" x2="560" y2="282" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="8,4"/>

