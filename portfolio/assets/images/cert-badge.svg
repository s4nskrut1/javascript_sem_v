<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Certificate Canvas -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="url(#certBg)" stroke="#6366f1" stroke-width="2"/>
  <rect x="35" y="35" width="530" height="330" rx="12" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Header Badge -->
  <circle cx="300" cy="110" r="42" fill="url(#goldGrad)" filter="drop-shadow(0px 8px 16px rgba(245, 158, 11, 0.4))"/>
  <path d="M 285 105 L 295 118 L 320 95" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Certificate Ribbons -->
  <path d="M 280 145 L 270 185 L 290 175 L 300 185 L 300 145 Z" fill="#b45309"/>
  <path d="M 320 145 L 330 185 L 310 175 L 300 185 L 300 145 Z" fill="#d97706"/>

  <!-- Texts -->
  <text x="300" y="215" fill="#e0e7ff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">CERTIFICATE OF EXCELLENCE</text>
  <text x="300" y="245" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="13" text-anchor="middle">OFFICIALLY VERIFIED CREDENTIAL</text>
  
  <!-- Divider -->
  <line x1="200" y1="265" x2="400" y2="265" stroke="#4f46e5" stroke-width="1.5"/>

  <!-- Decorative Footer -->
  <text x="100" y="320" fill="#94a3b8" font-family="monospace" font-size="11">ISSUER: VERIFIED AUTHORITY</text>
  <text x="500" y="320" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">STATUS: AUTHENTICATED ✓</text>
</svg>
