    <rect x="59" y="0" width="4" height="24"/>
    <rect x="65" y="0" width="2" height="24"/>
    <rect x="69" y="0" width="5" height="24"/>
    <rect x="76" y="0" width="2" height="24"/>
    <rect x="80" y="0" width="3" height="24"/>
