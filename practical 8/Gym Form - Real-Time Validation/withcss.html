<!DOCTYPE html>
<html>
<head>
    <title>Gym Admission Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --black: #121212;
            --black-soft: #1b1b1b;
            --orange: #ff7043;
            --orange-dark: #e85d32;
            --cream: #f8f6f2;
            --white: #ffffff;
            --text: #202020;
            --muted: #858585;
            --border: #e4e1dc;
            --error: #d94b4b;
            --success: #2f855a;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(
                    circle at 8% 15%,
                    rgba(255, 112, 67, 0.13),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 92% 85%,
                    rgba(255, 112, 67, 0.10),
                    transparent 25%
                ),
                #eceae6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: min(960px, 100%);
            background: var(--white);
            border-radius: 22px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 34% 66%;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.13),
                0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .side {
            position: relative;
            overflow: hidden;
            padding: 38px 32px;
            min-height: 570px;
            background:
                radial-gradient(
                    circle at 80% 30%,
                    rgba(255, 112, 67, 0.18),
                    transparent 30%
                ),
                linear-gradient(155deg, #222222, #101010);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .side::before {
            content: "";
            position: absolute;
            width: 330px;
            height: 330px;
            border: 1px solid rgba(255, 112, 67, 0.18);
            border-radius: 50%;
            top: 95px;
            left: -180px;
        }

        .side::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            border: 45px solid rgba(255, 255, 255, 0.025);
            border-radius: 50%;
            right: -150px;
            bottom: -100px;
        }

        .logo {
            position: relative;
            z-index: 2;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .logo span {
            color: var(--orange);
        }

        .side-content {
            position: relative;
            z-index: 2;
        }

        .side-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: rgba(255, 112, 67, 0.12);
            border: 1px solid rgba(255, 112, 67, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 24px;
        }

        .side-content h1 {
            font-size: 36px;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 15px;
        }

        .side-content h1 span {
            color: var(--orange);
        }

        .side-content p {
            color: #9c9c9c;
            font-size: 13px;
            line-height: 1.7;
            max-width: 240px;
        }

        .side-bottom {
            position: relative;
            z-index: 2;
        }

        .mini-info {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .mini-box {
            flex: 1;
            padding: 12px 9px;
            border-radius: 9px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.07);
        }

        .mini-box strong {
            display: block;
            color: white;
            font-size: 16px;
            margin-bottom: 3px;
        }

        .mini-box span {
            color: #777;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .credit {
            color: #686868;
            font-size: 9px;
            line-height: 1.7;
        }

        .credit strong {
            color: #a2a2a2;
            font-weight: 600;
        }

        .form-area {
            padding: 42px 48px;
            background: var(--cream);
            display: flex;
            align-items: center;
        }

        .form-wrapper {
            width: 100%;
        }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 27px;
        }

        .header-label {
            color: var(--orange-dark);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        h2 {
            margin: 0;
            color: var(--text);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        h2 span {
            color: var(--orange);
        }

        .form-number {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            color: #9a958d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 20px;
        }

        .field {
            margin-bottom: 10px;
        }

        label {
            display: block;
            color: #48443f;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: white;
            color: var(--text);
            font-size: 13px;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #aaa6a0;
        }

        input:focus,
        select:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.10);
        }

        input:hover,
        select:hover {
            border-color: #c7c2bb;
        }

        select {
            cursor: pointer;
        }

        .error {
            display: block;
            min-height: 16px;
            color: var(--error);
            font-size: 10px;
            margin-top: 3px;
        }

        .membership {
            grid-column: span 2;
        }

        .membership select {
            height: 47px;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 13px;
            border: none;
            border-radius: 8px;
            background: var(--black);
            color: white;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        button:hover {
            background: var(--orange);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 112, 67, 0.20);
        }

        button:active {
            transform: translateY(0);
        }

        .success {
            min-height: 18px;
            color: var(--success);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin: 13px 0 0;
        }

        @media (max-width: 800px) {
            body {
                padding: 15px;
            }

            .container {
                grid-template-columns: 1fr;
            }

            .side {
                min-height: 390px;
            }

            .form-area {
                padding: 40px 30px;
            }
        }

        @media (max-width: 550px) {
            .side {
                padding: 30px 25px;
            }

            .side-content h1 {
                font-size: 30px;
            }

            .form-area {
                padding: 35px 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .membership {
                grid-column: span 1;
            }

            .header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="side">

        <div class="logo">
            IRON<span>FIT</span>
        </div>

        <div class="side-content">

            <div class="side-icon">
                💪
            </div>

            <h1>
                Gym<br>
                <span>Admission</span>
            </h1>

            <p>
                Register your details and choose a membership
                plan to complete your gym admission.
            </p>

        </div>

        <div class="side-bottom">

            <div class="mini-info">

                <div class="mini-box">
                    <strong>24/7</strong>
                    <span>Access</span>
                </div>

                <div class="mini-box">
                    <strong>50+</strong>
                    <span>Equipment</span>
                </div>

                <div class="mini-box">
                    <strong>10K+</strong>
                    <span>Members</span>
                </div>

            </div>

            <div class="credit">
                Designed by <strong>Sanskruti Gorle</strong><br>
                PRN: <strong>24070521025</strong>
            </div>

        </div>

    </div>

    <div class="form-area">

        <div class="form-wrapper">

            <div class="header">

                <div>
                    <div class="header-label">
                        Registration
                    </div>

                    <h2>
                        Member <span>Details</span>
                    </h2>
                </div>

                <div class="form-number">
                    01
                </div>

            </div>

            <form id="gymForm">

                <div class="form-grid">

                    <div class="field">
                        <label>Full Name</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                        >
                        <span id="nameError" class="error"></span>
                    </div>

                    <div class="field">
                        <label>Age</label>
                        <input
                            type="number"
                            id="age"
                            placeholder="Enter your age"
                        >
                        <span id="ageError" class="error"></span>
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >
                        <span id="emailError" class="error"></span>
                    </div>

                    <div class="field">
                        <label>Mobile Number</label>
                        <input
                            type="text"
                            id="mobile"
                            placeholder="Enter 10-digit number"
                        >
                        <span id="mobileError" class="error"></span>
                    </div>

                    <div class="field membership">

                        <label>Membership Plan</label>

                        <select id="plan">
                            <option value="">Select Plan</option>
                            <option>Monthly</option>
                            <option>Quarterly</option>
                            <option>Yearly</option>
                        </select>

                        <span id="planError" class="error"></span>

                    </div>

                </div>

                <button type="submit">
                    JOIN NOW&nbsp;&nbsp; →
                </button>

                <p id="result" class="success"></p>

            </form>

        </div>

    </div>

</div>

<script>

// Name Validation (input event)
document.getElementById("name").addEventListener("input", function(){
    let name=this.value;
    if(/^[A-Za-z ]+$/.test(name)){
        document.getElementById("nameError").innerHTML="";
    }else{
        document.getElementById("nameError").innerHTML="Only letters allowed.";
    }
});

// Age Validation (blur event)
document.getElementById("age").addEventListener("blur", function(){
    let age=this.value;
    if(age>=16 && age<=60){
        document.getElementById("ageError").innerHTML="";
    }else{
        document.getElementById("ageError").innerHTML="Age must be between 16 and 60.";
    }
});

// Email Validation (input event)
document.getElementById("email").addEventListener("input", function(){
    let email=this.value;
    let pattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if(pattern.test(email)){
        document.getElementById("emailError").innerHTML="";
    }else{
        document.getElementById("emailError").innerHTML="Invalid email.";
    }
});

// Mobile Validation (input event)
document.getElementById("mobile").addEventListener("input", function(){
    let mobile=this.value;

    if(/^\d{10}$/.test(mobile)){
        document.getElementById("mobileError").innerHTML="";
    }else{
        document.getElementById("mobileError").innerHTML="Enter 10-digit mobile number.";
    }
});

// Membership Validation (change event)
document.getElementById("plan").addEventListener("change", function(){
    if(this.value==""){
        document.getElementById("planError").innerHTML="Please select a plan.";
    }else{
        document.getElementById("planError").innerHTML="";
    }
});

// Form Submission (submit event)
document.getElementById("gymForm").addEventListener("submit", function(e){

    e.preventDefault();

    if(
        document.getElementById("nameError").innerHTML=="" &&
        document.getElementById("ageError").innerHTML=="" &&
        document.getElementById("emailError").innerHTML=="" &&
        document.getElementById("mobileError").innerHTML=="" &&
        document.getElementById("plan").value!=""
    ){
        document.getElementById("result").innerHTML="Gym Admission Successful!";
    }
    else{
        document.getElementById("result").innerHTML="";
        alert("Please correct the errors before submitting.");
    }
});

</script>

</body>
</html>
