<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown Timer & Class Scheduler</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Countdown Timer</h1>
        <p class="subtitle">Manage your study time efficiently!</p>

        <!-- Countdown Timer -->
        <section class="card">
            <h2>Study Timer</h2>

            <label for="minutes">Enter Minutes:</label>
            <input type="number" id="minutes" min="1" value="5">

            <div id="countdown">05:00</div>

            <p id="status">Ready to start?</p>

            <div class="buttons">
                <button id="startBtn">Start</button>
                <button id="pauseBtn">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
        </section>

        <!-- Class Scheduler -->
        <section class="card">
            <h2>Class Scheduler</h2>

            <form id="scheduleForm">

                <label for="className">Class Name:</label>
                <input
                    type="text"
                    id="className"
                    placeholder="Enter class name"
                    required
                >

                <label for="classTime">Date and Time:</label>
                <input type="datetime-local" id="classTime" required>

                <button type="submit">Add Class</button>

            </form>

            <p id="message"></p>

            <h3>Scheduled Classes</h3>
            <div id="classList">No classes scheduled.</div>
        </section>

    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
