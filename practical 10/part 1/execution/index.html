<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #202b46;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .heading h2 {
            margin: 0 0 10px;
            font-size: 30px;
            color: #202b46;
        }

        .heading p {
            margin: 0;
            color: #7a8499;
            font-size: 14px;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            background: #6558d3;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 12px #6558d333;
            transition: 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background: #5043bd;
            transform: translateY(-2px);
        }

        .table-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 30px #202b460d;
            border: 1px solid #e8ebf2;
        }

        .table-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .table-heading h3 {
            margin: 0;
            font-size: 18px;
        }

        .tag {
            background: #eeecff;
            color: #6558d3;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f7f8fc;
            color: #788197;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            padding: 16px;
            border-bottom: 1px solid #e9ecf3;
        }

        td {
            padding: 18px 16px;
            font-size: 14px;
            border-bottom: 1px solid #edf0f5;
            color: #38435a;
        }

        tbody tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #f7f6ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td:first-child {
            color: #6558d3;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #8a93a6;
            font-size: 12px;
            margin-top: 30px;
        }

        @media (max-width: 650px) {
            body {
                padding: 25px 12px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .heading h2 {
                font-size: 25px;
            }

            .table-card {
                padding: 15px;
            }

            th, td {
                padding: 13px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="heading">
                <h2>Student Details</h2>
                <p>View student information fetched from a JSON file.</p>
            </div>

            <button onclick="loadStudents()">↻ Load Students</button>
        </div>

        <div class="table-card">

            <div class="table-heading">
                <h3>Student Records</h3>
                <span class="tag">JSON DATA</span>
            </div>

            <div class="table-wrapper">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Marks</th>
                        </tr>
                    </thead>

                    <tbody>
                    </tbody>
                </table>
            </div>

        </div>

        <div class="footer">
            Student Management · Fetch API
        </div>

    </div>

    <script>
        function loadStudents() {
            fetch("students.json")
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.querySelector("#studentTable tbody");

                    tableBody.innerHTML = "";

                    data.forEach(students => {
                        let row = `
                            <tr>
                                <td>${students.id}</td>
                                <td>${students.name}</td>
                                <td>${students.department}</td>
                                <td>${students.marks}</td>
                            </tr>
                        `;

                        tableBody.innerHTML += row;
                    });
                })
                .catch(error => {
                    console.log('Error:', error);
                });
        }
    </script>

</body>
</html>
