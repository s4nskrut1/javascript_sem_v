<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Order Management</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0; 
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff1eb, #ffe0d2);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        } 

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #d35400;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .button-area {
            text-align: center;
            margin-bottom: 25px;
        }

        #viewOrders {
            background: #e67e22;
            color: white;
            border: none;
            padding: 13px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        #viewOrders:hover {
            background: #d35400;
            transform: translateY(-2px);
        }

        #message {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background: #d35400;
            color: white;
            padding: 14px;
            text-align: center;
        }

        td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #fff5ef;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
        }

        .preparing {
            background: #fff0c2;
            color: #9a6700;
        }

        .ready {
            background: #d9f7e8;
            color: #16834b;
        }

        .delivered {
            background: #dcecff;
            color: #1769aa;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .summary-box {
            flex: 1;
            padding: 20px;
            background: #fff7f2;
            border-left: 5px solid #e67e22;
            border-radius: 10px;
        }

        .summary-box h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .summary-box p {
            color: #d35400;
            font-size: 25px;
            font-weight: bold;
        }

        #errorMessage {
            display: none;
            background: #ffe5e5;
            color: #c0392b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 25px;
            }

            .summary {
                flex-direction: column;
            }

            th,
            td {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🍴 Restaurant Order Management</h1>
            <p>View and manage today's online food orders</p>
        </div>

        <div class="button-area">
            <button id="viewOrders">View Orders</button>
        </div>

        <div id="message"></div>

        <div class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Name</th>
                        <th>Food Item</th>
                        <th>Quantity</th>
                        <th>Total Amount</th>
                        <th>Order Status</th>
                    </tr>
                </thead>

                <tbody id="ordersBody">
                </tbody>
            </table>
        </div>

        <div id="errorMessage">
            Unable to load orders. Please make sure orders.json is available.
        </div>

        <div class="summary">

            <div class="summary-box">
                <h3>Total Number of Orders</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="summary-box">
                <h3>Total Sales Amount</h3>
                <p id="totalSales">₹0</p>
            </div>

        </div>

    </div>


    <script>

        $(document).ready(function () {

            $("#viewOrders").click(function () {

                $("#ordersBody").empty();

                $("#totalOrders").text("0");
                $("#totalSales").text("₹0");

                $("#errorMessage").hide();

                $.getJSON("orders.json", function (orders) {

                    let totalSales = 0;
                    let totalOrders = 0; 

                    $.each(orders, function (index, order) {

                        let statusClass = "";

                        if (order.orderStatus === "Preparing") {
                            statusClass = "preparing";
                        }
                        else if (order.orderStatus === "Ready") {
                            statusClass = "ready";
                        }
                        else if (order.orderStatus === "Delivered") {
                            statusClass = "delivered"; 
                        } 

                        let row = `
                            <tr>
                                <td>${order.orderId}</td>
                                <td>${order.customerName}</td>
                                <td>${order.foodItem}</td>
                                <td>${order.quantity}</td>
                                <td>₹${order.totalAmount}</td>
                                <td>
                                    <span class="status ${statusClass}">
                                        ${order.orderStatus}
                                    </span>
                                </td>
                            </tr>
                        `;

                        $("#ordersBody").append(row);

                        totalOrders++;
                        totalSales += Number(order.totalAmount);
                    });

                    $("#totalOrders").text(totalOrders);
                    $("#totalSales").text("₹" + totalSales);

                    $("#message")
                        .text("Orders loaded successfully!")
                        .css("color", "#16834b");

                })

                .fail(function () {

                    $("#errorMessage").show();

                    $("#message")
                        .text("Failed to load orders.")
                        .css("color", "#c0392b");

                });

            });

        });

    </script>

</body>
</html>
